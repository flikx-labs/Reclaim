<style>
:root {
  --bg: #F6EFE8;
  --bg-elev: rgba(255, 255, 255, 0.84);
  --ink: #1A152B;
  --mute: #726A82;
  --gl: rgba(255, 255, 255, 0.74);
  --gl-strong: rgba(255, 255, 255, 0.92);
  --ln: rgba(26, 21, 43, 0.09);
  --ln-strong: rgba(26, 21, 43, 0.18);
  --spec: rgba(255, 255, 255, 0.75);
  --shd: 0 14px 34px -12px rgba(26, 21, 43, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.75);
  --a: #EA5E36;
  --b: #FFA84C;
  --ok: #259672;
  --warn: #E09132;
  --sky: rgba(255, 168, 76, 0.42);
  --sky-2: rgba(234, 94, 54, 0.16);
  --b-scale: 0.65;
  --b-op: 0.45;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090B16;
    --bg-elev: rgba(19, 22, 40, 0.88);
    --ink: #F6EFE8;
    --mute: #9D96B2;
    --gl: rgba(255, 255, 255, 0.055);
    --gl-strong: rgba(255, 255, 255, 0.11);
    --ln: rgba(255, 255, 255, 0.095);
    --ln-strong: rgba(255, 255, 255, 0.20);
    --spec: rgba(255, 255, 255, 0.12);
    --shd: 0 18px 40px -14px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.11);
    --ok: #3FC498;
    --warn: #FFB656;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090B16;
  --bg-elev: rgba(19, 22, 40, 0.88);
  --ink: #F6EFE8;
  --mute: #9D96B2;
  --gl: rgba(255, 255, 255, 0.055);
  --gl-strong: rgba(255, 255, 255, 0.11);
  --ln: rgba(255, 255, 255, 0.095);
  --ln-strong: rgba(255, 255, 255, 0.20);
  --spec: rgba(255, 255, 255, 0.12);
  --shd: 0 18px 40px -14px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.11);
  --ok: #3FC498;
  --warn: #FFB656;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background:
    radial-gradient(130% 65% at 50% -6%, var(--sky), transparent 68%) fixed,
    radial-gradient(90% 50% at 85% 12%, var(--sky-2), transparent 65%) fixed,
    var(--bg);
  min-height: 100%;
  overflow-x: hidden;
  transition: background-color 0.5s ease, color 0.35s ease;
  -webkit-font-smoothing: antialiased;
}

/* Subtle editorial matte grain overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* Glass Cards & Sheets — Luxury Frosted Quartz Depth */
.gl, .sheet, .note {
  background: var(--gl);
  border: 1px solid var(--ln);
  border-radius: 24px;
  box-shadow: var(--shd);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
}
.note {
  padding: 15px 17px;
  margin: 0 0 12px;
  font-size: 14px;
  line-height: 1.55;
}
.sheet {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-top: 16px;
  overflow: hidden;
}
.sheet > div {
  padding: 17px 18px;
  transition: background 0.2s ease;
}
.sheet > div:hover {
  background: var(--gl-strong);
}
.sheet > div:nth-child(odd) {
  border-right: 1px solid var(--ln);
}
.sheet > div:nth-child(-n+2) {
  border-bottom: 1px solid var(--ln);
}
.sheet span {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--mute);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sheet b {
  display: block;
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 400;
  font-size: 27px;
  letter-spacing: -0.02em;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

/* Multi-Habit Portfolio Ribbon & Prefrontal Cooling Lockout Banner */
.portfolio-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 15px;
  margin: 6px 0 8px;
  border-radius: 18px;
  background: var(--gl-strong);
  border: 1px solid var(--ln-strong);
  box-shadow: var(--shd);
  font-size: 12.5px;
}
.lockout-banner {
  padding: 14px 16px;
  margin: 10px 0;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(37, 150, 114, 0.16), rgba(255, 168, 76, 0.14));
  border: 1.5px solid var(--ok);
  box-shadow: var(--shd);
}
#orbSatGroup {
  transform-origin: 140px 140px;
  transition: transform 0.85s cubic-bezier(0.2, 0.7, 0.2, 1);
}

/* Ambient sky canvas behind UI */
#skyCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0.75;
}

/* View transition animation (E3) + Staggered Card Cascade */
.view-enter {
  animation: viewEnter 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
.view-enter > * {
  animation: cardCascade 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.view-enter > *:nth-child(1) { animation-delay: 0.02s; }
.view-enter > *:nth-child(2) { animation-delay: 0.05s; }
.view-enter > *:nth-child(3) { animation-delay: 0.08s; }
.view-enter > *:nth-child(4) { animation-delay: 0.11s; }
.view-enter > *:nth-child(5) { animation-delay: 0.14s; }
.view-enter > *:nth-child(6) { animation-delay: 0.17s; }
.view-enter > *:nth-child(7) { animation-delay: 0.20s; }

@keyframes viewEnter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cardCascade {
  from { opacity: 0; transform: translateY(12px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes popCheck {
  0% { transform: scale(0.8); }
  50% { transform: scale(1.16); }
  100% { transform: scale(1); }
}

/* Compact 4-Tile Daily Restoration Grid */
.bdnf-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.bdnf-tile {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  border-radius: 16px;
  border: 1px solid var(--ln);
  background: var(--gl);
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: var(--ink);
  transition: transform 0.16s ease, border-color 0.2s ease, background 0.2s ease;
}
.bdnf-tile:hover {
  border-color: var(--ln-strong);
  transform: translateY(-1px);
}
.bdnf-tile:active {
  transform: scale(0.96);
}
.bdnf-tile.done {
  border-color: var(--ok);
  background: rgba(45, 157, 120, 0.13);
}
.bdnf-tile.done .bdnf-ico {
  animation: popCheck 0.32s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.bdnf-ico {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--gl-strong);
  border: 1px solid var(--ln);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex: none;
}
.bdnf-tile.done .bdnf-ico {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}

/* Editorial typography */
.serif {
  font-family: 'Fraunces', Georgia, serif;
}

header.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  max-width: 500px;
  margin: 0 auto;
  padding: 12px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  font-weight: 400;
  letter-spacing: -0.02em;
}
.brand-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--b), var(--a));
  box-shadow: 0 0 12px var(--a);
}

.icon-btn {
  border: 1px solid var(--ln);
  background: var(--gl);
  color: var(--ink);
  height: 36px;
  min-width: 36px;
  padding: 0 10px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.icon-btn:hover {
  border-color: var(--ln-strong);
  transform: translateY(-1px);
}
.icon-btn:active {
  transform: scale(0.95);
}

main {
  position: relative;
  z-index: 1;
  max-width: 500px;
  margin: 0 auto;
  padding: 6px 20px 155px;
}

h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 400;
  font-size: 33px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin: 8px 0 8px;
}
h2 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mute);
  margin: 28px 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
p {
  margin: 0 0 12px;
  color: var(--mute);
  line-height: 1.55;
  font-size: 15px;
}

/* Horizontal Pill Switcher */
.pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 0 6px;
}
.pills::-webkit-scrollbar {
  display: none;
}
.pill {
  flex: none;
  border: 1px solid var(--ln);
  background: var(--gl);
  color: var(--ink);
  padding: 8px 15px;
  border-radius: 99px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pill:hover {
  border-color: var(--ln-strong);
}
.pill.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  font-weight: 600;
}

/* Central Interactive Sky Orb */
.orb {
  position: relative;
  width: min(310px, 84vw);
  aspect-ratio: 1;
  margin: 18px auto 10px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.orb:active {
  transform: scale(0.975);
}
.glow {
  position: absolute;
  inset: 11%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--b), var(--a) 56%, transparent 74%);
  filter: blur(40px);
  opacity: 0.45;
  animation: pulseGlow 7s ease-in-out infinite alternate;
}
@keyframes pulseGlow {
  0% { transform: scale(0.94); opacity: 0.38; }
  100% { transform: scale(1.06); opacity: 0.52; }
}
.orb svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.tr {
  fill: none;
  stroke: var(--ln);
  stroke-width: 5.5;
}
.tr-inner {
  fill: none;
  stroke: var(--ln);
  stroke-width: 2.2;
  stroke-dasharray: 2 6;
}
.pg {
  fill: none;
  stroke-width: 5.5;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.pg-inner {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  opacity: 0.75;
  transition: stroke-dashoffset 0.8s ease;
}
.ct {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.ct small {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--mute);
  font-weight: 600;
}
.ct b {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 300;
  font-size: clamp(50px, 16vw, 84px);
  line-height: 1.02;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  margin: 3px 0;
}
.ct span {
  font-size: 14px;
  font-weight: 500;
  margin-top: 1px;
}
.ct em {
  font-style: normal;
  font-size: 13px;
  color: var(--mute);
  margin-top: 10px;
  font-variant-numeric: tabular-nums;
  background: var(--gl);
  padding: 3px 11px;
  border-radius: 99px;
  border: 1px solid var(--ln);
}

.nx {
  text-align: center;
  font-size: 13.5px;
  margin-bottom: 12px;
}

/* Responsive Utility Classes (replaces external Tailwind Play CDN) */
.hidden { display: none; }
@media (min-width: 640px) {
  .sm\:inline { display: inline; }
}

/* Primary & Secondary Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  border: 0;
  border-radius: 99px;
  padding: 15px 20px;
  font: inherit;
  font-weight: 600;
  font-size: 15.5px;
  color: #fff;
  background: linear-gradient(135deg, var(--b), var(--a));
  margin-top: 12px;
  box-shadow: 0 10px 30px -10px var(--a);
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
}
.btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 14px 32px -8px var(--a);
}
.btn:active:not(:disabled) {
  transform: scale(0.985);
}
.btn:disabled {
  opacity: 0.35;
  box-shadow: none;
  cursor: not-allowed;
}
.btn.ghost {
  background: var(--gl);
  color: var(--ink);
  border: 1px solid var(--ln);
  box-shadow: none;
}
.btn.link {
  background: none;
  color: var(--mute);
  font-weight: 500;
  font-size: 13.5px;
  box-shadow: none;
  margin-top: 8px;
}

/* Hold-to-Pledge Ritual Card */
.pledge-card {
  position: relative;
  overflow: hidden;
  padding: 18px;
  margin-top: 16px;
}
.pledge-btn {
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  width: 100%;
  border: 1px solid var(--ln-strong);
  background: var(--gl-strong);
  color: var(--ink);
  border-radius: 99px;
  padding: 14px;
  font: inherit;
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
}
.pledge-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, var(--b), var(--a));
  opacity: 0.28;
  transition: width 0.05s linear;
  pointer-events: none;
}

/* Bars & Rows */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  height: 124px;
  padding: 18px 16px 12px;
}
.bars div {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  height: 100%;
  font-size: 11px;
  color: var(--mute);
  gap: 6px;
}
.bars i {
  display: block;
  width: 100%;
  border-radius: 8px 8px 3px 3px;
  background: linear-gradient(var(--b), var(--a));
  min-height: 4px;
  transition: height 0.5s ease;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--ln);
  font-size: 14.5px;
  gap: 12px;
}
.row:last-child {
  border: 0;
}
.row small {
  color: var(--mute);
  font-size: 12.5px;
  flex: none;
}

/* Recovery Timeline Progress Bars */
.rec-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--ln);
}
.rec-item:last-child {
  border-bottom: 0;
}
.rec-bar {
  height: 6px;
  background: var(--ln);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
}
.rec-bar > i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--b), var(--a));
  transition: width 0.6s ease;
}

/* Horizontal Scrollable Body & Mind Recovery Carousel */
.rec-carousel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 28px 0 10px;
  flex-wrap: wrap;
}
.rec-carousel {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  padding: 6px 4px 14px;
  margin: 0 -4px;
}
.rec-carousel::-webkit-scrollbar {
  display: none;
}
.rec-card {
  flex: 0 0 min(285px, 78vw);
  scroll-snap-align: start;
  background: var(--gl);
  border: 1px solid var(--ln);
  border-radius: 22px;
  padding: 16px 17px;
  box-shadow: var(--shd);
  backdrop-filter: blur(22px) saturate(1.3);
  -webkit-backdrop-filter: blur(22px) saturate(1.3);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  position: relative;
  transition: transform 0.2s ease, border-color 0.25s ease;
}
.rec-card:hover {
  transform: translateY(-2px);
  border-color: var(--ln-strong);
}
.rec-card.done {
  border-color: rgba(37, 150, 114, 0.48);
  background: linear-gradient(160deg, rgba(37, 150, 114, 0.09), var(--gl));
}
.rec-card.current {
  border-color: var(--a);
  border-width: 1.5px;
  background: linear-gradient(160deg, rgba(255, 168, 76, 0.14), var(--gl-strong));
}
.rec-sys-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--gl-strong);
  border: 1px solid var(--ln);
  color: var(--mute);
}
.rec-card.done .rec-sys-badge {
  color: var(--ok);
  border-color: rgba(37, 150, 114, 0.35);
}
.rec-card.current .rec-sys-badge {
  color: var(--a);
  border-color: rgba(234, 94, 54, 0.4);
}
.rec-nav-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--ln-strong);
  background: var(--gl-strong);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.14s ease, background 0.15s ease;
}
.rec-nav-btn:active {
  transform: scale(0.9);
}

/* 30-day Consistency Heatmap (D2) */
.heatmap {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;

  t: [],          // Trackers array
  a: null,        // Active tracker ID
  j: [],          // Journal entries

function getNeuroScale(t) {
  if (!t) return 1.0;
  const meta = getTyMeta(t.ty);
  const defaultP = meta[2] || 1;
  const intensityRatio = Math.min(2.2, Math.max(0.7, (t.p || defaultP) / defaultP));
  const yrs = +(t.yrs || 1);
  const chronicityAdd = Math.min(0.45, Math.max(0, (yrs - 1) * 0.05));
  return +(Math.min(1.85, Math.max(0.85, 0.8 + intensityRatio * 0.22 + chronicityAdd))).toFixed(2);
}

function st(t) {
  const d = Math.max(0, (Date.now() - t.s) / 864e5);
  const exactN = d * (t.p || 0);
  const n = Math.floor(exactN);
  const h = (exactN * (t.k || 0)) / 60; // Continuous hours reclaimed from minute 1
  const m = exactN * (t.c || 0);        // Continuous money saved
  return { d, n, exactN, m, h };
}

// M3: Compute today's daily allowance target if in Step-Down Taper mode
function getTaperStatus(t) {
  if (!t || t.mode !== 'taper') return null;
  const startUnits = +(t.taperStart || t.p || 10);
  const totalDays = Math.max(1, +(t.taperDays || 14));
  const elapsedDays = Math.max(0, (Date.now() - t.s) / 864e5);
  const targetToday = Math.max(0, Math.round((startUnits * (1 - elapsedDays / totalDays)) * 10) / 10);
  const k = todayKey();
  const usedToday = (S.pl && S.pl[k] && S.pl[k].taperUsed && typeof S.pl[k].taperUsed[t.id] === 'number')
    ? S.pl[k].taperUsed[t.id]
    : 0;
  const pctComplete = Math.min(100, Math.round((elapsedDays / totalDays) * 100));
  return { startUnits, totalDays, elapsedDays, targetToday, usedToday, pctComplete };
}

function adjustTaperUsed(delta) {

}

function getCleanRate30(t) {
  const slips = Array.isArray(t.slips) ? t.slips : [];
  const now = Date.now();
  const slipDaysSet = new Set();
  slips.forEach(sl => {
    if (now - sl.ts <= 30 * 864e5) slipDaysSet.add(todayKey(sl.ts));
  });
  const cleanDays = Math.max(0, 30 - slipDaysSet.size);
  return { pct: Math.round((cleanDays / 30) * 100), slipDaysCount: slipDaysSet.size };
}

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freqs = [432, 648], dur = 1.4, type = 'sine', vol = 0.065) {
  if (!S.snd) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    freqs.forEach((f, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol / (idx + 1), now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    });
  } catch (e) {}
}

// Stereo-panned bilateral audio pulse for EMDR Ocular Pacer
function playPanPulse(panVal = 0, freq = 396) {
  if (!S.snd) return;
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.04, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    if (panner) {
      panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal)), now);
      osc.connect(gain);
      gain.connect(panner);
      panner.connect(ctx.destination);
    } else {
      osc.connect(gain);
      gain.connect(ctx.destination);
    }
    osc.start(now);
    osc.stop(now + 0.3);
  } catch (e) {}
}

function setSoundscape(mode) {
  stopSoundscape();
  activeSoundscape = mode;
  applyTheme();
  if (mode === 'off') {
    showToast('Ambient soundscape turned off');
    return;
  }
  try {
    const ctx = getAudioCtx();
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.001, ctx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.8);
    master.connect(ctx.destination);
    const sources = [];

    if (mode === 'theta' || mode === 'gamma') {
      const beat = mode === 'theta' ? 6 : 40;
      const baseF = 200;
      const oscL = ctx.createOscillator();
      const oscR = ctx.createOscillator();
      const panL = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      const panR = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      oscL.frequency.value = baseF;
      oscR.frequency.value = baseF + beat;
      if (panL && panR) {
        panL.pan.value = -0.85;
        panR.pan.value = 0.85;
        oscL.connect(panL); panL.connect(master);
        oscR.connect(panR); panR.connect(master);
      } else {
        oscL.connect(master); oscR.connect(master);
      }
      oscL.start(); oscR.start();
      sources.push(oscL, oscR);
    } else if (mode === 'rain') {
      // Procedural warm pink/brown noise buffer
      const bufSize = ctx.sampleRate * 3;
      const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const out = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
        b6 = white * 0.115926;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 680;
      noise.connect(filter);
      filter.connect(master);
      noise.start();
      sources.push(noise);
    } else if (mode === 'drone') {
      [216, 432, 648].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = i === 0 ? 'triangle' : 'sine';
        osc.frequency.value = freq;
        g.gain.value = 0.35 / (i + 1);
        osc.connect(g);
        g.connect(master);
        osc.start();
        sources.push(osc);
      });
    }

    ambNodes = { master, sources };
    showToast(`🎧 Playing: ${SOUNDSCAPES[mode].name}`);
  } catch (e) {}
}

function getRelapseShield(t) {
  if (!t) return { score: 80, label: 'Strong', factors: [] };
  const tkDay = todayKey();
  const pledged = Boolean(S.pl && S.pl[tkDay] && S.pl[tkDay].pledged);
  const mood = S.pl && S.pl[tkDay] ? S.pl[tkDay].mood : '';
  const bdnf = (S.pl && S.pl[tkDay] && S.pl[tkDay].bdnf) ? S.pl[tkDay].bdnf : {};
  const bdnfCount = Object.values(bdnf).filter(Boolean).length;
  const env = getEnvScore(t);

  // Check if current hour matches user's peak craving window
  const C = S.cr.filter(x => x.t == t.id);
  const bn = [0, 0, 0, 0, 0];
  C.forEach(x => {
    const h = new Date(x.ts).getHours();
    bn[h < 6 ? 0 : h < 11 ? 1 : h < 15 ? 2 : h < 19 ? 3 : 4]++;
  });
  const nowH = new Date().getHours();
  const curBucket = nowH < 6 ? 0 : nowH < 11 ? 1 : nowH < 15 ? 2 : nowH < 19 ? 3 : 4;
  const isPeakDangerHour = C.length >= 2 && bn[curBucket] === Math.max(...bn) && bn[curBucket] > 0;

  let score = 45;
  if (pledged) score += 18;
  score += bdnfCount * 5; // up to +20
  score += Math.round((env.pct / 100) * 12); // up to +12
  if (mood === 'Calm' || mood === 'Focused' || mood === 'Grateful') score += 5;
  if (mood === 'Restless' || mood === 'Tired' || mood === 'Flatline') score -= 6;
  if (isPeakDangerHour) score -= 10;

  score = Math.max(15, Math.min(99, score));
  const label = score >= 82 ? 'Fortified Shield' : score >= 62 ? 'Moderate Shield' : 'Elevated Vulnerability';
  return { score, label, pledged, bdnfCount, envPct: env.pct, isPeakDangerHour, mood };
}

/* ==========================================
   AMBIENT SKY HORIZON PARTICLE CANVAS + CELEBRATION BURST ENGINE
   ========================================== */
const skyParticles = Array.from({ length: 34 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.65,
  r: 0.8 + Math.random() * 1.8,
  vy: -0.00008 - Math.random() * 0.00018,
  vx: (Math.random() - 0.5) * 0.00015,
  ph: Math.random() * Math.PI * 2
}));
const burstParticles = [];

function triggerCelebrationBurst(originX = 0.5, originY = 0.42) {
  const colors = ['#FFB05C', '#F0663F', '#46C399', '#FFE082', '#FFFFFF'];
  for (let i = 0; i < 38; i++) {
    const angle = (Math.PI * 2 * i) / 38 + (Math.random() - 0.5) * 0.3;
    const speed = 0.003 + Math.random() * 0.009;
    burstParticles.push({
      x: originX,
      y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.003,
      r: 2.2 + Math.random() * 3.2,
      alpha: 1,
      color: colors[i % colors.length]
    });
  }
}

function initSkyCanvas() {
  const cv = $('#skyCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const resize = () => {
    cv.width = window.innerWidth * Math.min(window.devicePixelRatio || 1, 2);
    cv.height = window.innerHeight * Math.min(window.devicePixelRatio || 1, 2);
  };
  resize();
  window.addEventListener('resize', resize);

  function loop(tm) {
    if (document.hidden) {
      requestAnimationFrame(loop);
      return;
    }
    ctx.clearRect(0, 0, cv.width, cv.height);
    const t = cur();
    const stage = t ? stg(st(t).d) : 0;
    const w = cv.width, h = cv.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Subtle Aurora / Dawn Horizon Ribbon
    const grad = ctx.createLinearGradient(0, 0, w, h * 0.48);
    if (stage < 2) {
      grad.addColorStop(0, 'rgba(92, 107, 192, 0.08)');
      grad.addColorStop(0.5, 'rgba(171, 71, 188, 0.09)');
      grad.addColorStop(1, 'rgba(240, 102, 63, 0.03)');
    } else {
      grad.addColorStop(0, 'rgba(255, 176, 92, 0.14)');
      grad.addColorStop(0.5, 'rgba(240, 102, 63, 0.10)');
      grad.addColorStop(1, 'rgba(255, 215, 140, 0.04)');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let x = 0; x <= w; x += 40) {
      const y = h * 0.28 + Math.sin(x * 0.0025 + tm * 0.0006) * (h * 0.045) + Math.cos(x * 0.0012 - tm * 0.0004) * (h * 0.03);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, 0);
    ctx.closePath();
    ctx.fill();

    skyParticles.forEach(p => {
      p.x = (p.x + p.vx + 1) % 1;
      p.y = (p.y + p.vy + 0.65) % 0.65;
      const alpha = (0.2 + 0.35 * Math.sin(tm * 0.0015 + p.ph)) * (1 - p.y / 0.65);
      ctx.fillStyle = stage >= 3
        ? `rgba(255, 190, 110, ${alpha})`
        : `rgba(245, 238, 230, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, p.r * dpr, 0, Math.PI * 2);
      ctx.fill();
    });

    // Render celebration burst particles if active
    for (let i = burstParticles.length - 1; i >= 0; i--) {
      const b = burstParticles[i];
      b.x += b.vx;
      b.y += b.vy;
      b.vy += 0.00022; // gentle gravity
      b.alpha *= 0.96;
      ctx.save();
      ctx.globalAlpha = Math.max(0, b.alpha);
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x * w, b.y * h, b.r * dpr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (b.alpha < 0.03) burstParticles.splice(i, 1);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

          </div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="pill on" style="font-size:12px;padding:5px 12px" onclick="openIfThenModal('${esc(topTrigger)}')">

            </button>
          </div>
        ` : `
          <strong>No cravings logged yet.</strong> Use <b>SOS</b> whenever an urge hits to map your peak time-of-day danger window and compute your empirical Craving Half-Life.
        `}
      </div>

      <h2>When cravings hit</h2>
      ${C.length ? `
        <div class="gl bars">
          ${bn.map((x, i) => `<div><span style="font-size:10px">${x || ''}</span><i style="height:${(x / mx) * 76}px"></i>${BL_SHORT[i]}</div>`).join('')}
        </div>
      ` : '<p>Log cravings with SOS to see when and why they hit you.</p>'}

      <!-- SVG Pre- vs Post-SOS VAS Craving Decay Chart -->
      ${dr.length >= 2 ? (() => {
        const recent = dr.slice(-12);
        const w = 310, h = 110;
        const ptsPre = recent.map((c, idx) => `${24 + (idx / (recent.length - 1)) * (w - 40)},${h - 18 - (c.a / 10) * (h - 34)}`).join(' ');
        const ptsPost = recent.map((c, idx) => `${24 + (idx / (recent.length - 1)) * (w - 40)},${h - 18 - (c.b / 10) * (h - 34)}`).join(' ');
        return `
          <h2>VAS Craving Attenuation Curve (Pre vs. Post SOS)</h2>
          <div class="gl" style="padding:14px 16px">
            <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
              <line x1="20" y1="16" x2="${w-10}" y2="16" stroke="var(--ln)" stroke-dasharray="3 3"/>
              <line x1="20" y1="${h-18}" x2="${w-10}" y2="${h-18}" stroke="var(--ln)"/>
              <text x="2" y="20" fill="var(--mute)" font-size="9">10</text>
              <text x="6" y="${h-15}" fill="var(--mute)" font-size="9">0</text>
              <polyline fill="none" stroke="var(--a)" stroke-width="2.2" points="${ptsPre}"/>

            <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:4px">

              <span><b style="color:var(--ok)">●</b> Post-SOS Urge VAS (Avg −${av.toFixed(1)} drop)</span>
            </div>
          </div>
        `;
      })() : ''}

      <!-- N3: Dorsal-to-Ventral Striatal Prefrontal Extinction Reps per Trigger -->
      ${tp.length ? `
        <h2>Prefrontal extinction reps by trigger (N3)</h2>
        <div class="gl">
          ${tp.slice(0, 6).map(([trName, cnt]) => {
            const plan = getIfThen(t, trName);
            const extPct = Math.min(100, cnt * 20); // 5 unreinforced reps = strong extinction consolidation
            return `<div class="rec-item" style="cursor:pointer" onclick="openIfThenModal('${esc(trName)}')">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="font-weight:600">${esc(trName)} <small style="color:var(--mute);font-weight:400">· ${cnt} extinction rep${cnt == 1 ? '' : 's'}</small></div>
                <small style="color:var(--ok);font-weight:600">${extPct}% synaptic extinction</small>
              </div>
              <div class="rec-bar"><i style="width:${extPct}%"></i></div>
              <small style="display:block;margin-top:5px;color:${plan ? 'var(--ink)' : 'var(--mute)'};font-size:12px">
                ${plan ? `If ${esc(trName)} → I will ${esc(plan)}` : 'Tap to attach an If–Then substitute routine'}
              </small>
            </div>`;
          }).join('')}

      ` : ''}

      <!-- B1: If-Then Implementation Intentions Manager -->
      <h2>“If–Then” Trigger Action Plans <button class="pill" style="font-size:11px;padding:3px 10px;text-transform:none" onclick="openIfThenModal('${esc(topTrigger)}')">+ Add / Edit</button></h2>

          <div class="row" style="cursor:pointer" onclick="openIfThenModal('${esc(trKey)}')">

        ` : `
          <p style="margin:0;font-size:13.5px">Turn your <b>${fm(s.m)}</b> saved into a tangible reward (e.g. headphones, weekend trip, running shoes).</p>

      <!-- B3: Milestones (including 6h & 12h early anchors) -->
      <h2>Milestones (tap unlocked to share)</h2>
      <div class="ms">
        ${MS.map(x => {
          const done = s.d >= x[0];
          return `<span class="${done ? 'd' : ''}" onclick="${done ? `shareMilestone('${x[1]}','${x[2]}')` : ''}">

        }).join('')}
      </div>

      <!-- D1, M3 & M4: Horizontally Scrollable Physiological & Neurological Timeline Carousel -->
      ${(() => {
        const enriched = recList.map(([daysReq, label, desc, tag, sys], idx) => {
          const effectiveDays = (useScaledTimeline && tag === 'receptor' && daysReq >= 2)
            ? +(daysReq * neuroScale).toFixed(1)
            : daysReq;
          const pct = realT ? Math.min(100, Math.max(0, Math.round((s.d / effectiveDays) * 100))) : 0;
          const remDays = Math.max(0, effectiveDays - s.d);
          const remTxt = remDays * 24 < 1
            ? `${Math.max(1, Math.ceil(remDays * 1440))}m left`
            : remDays < 2
            ? `${(remDays * 24).toFixed(1)}h left`
            : remDays < 60
            ? `${Math.ceil(remDays)}d left`
            : `${(remDays / 30).toFixed(1)}mo left`;
          return { daysReq, effectiveDays, label, desc, tag, sys: sys || (tag === 'delivery' ? '🫁 Systemic Clearance' : '🧠 Neuro-Receptor'), pct, remTxt, idx };
        });
        const unlockedCount = enriched.filter(x => x.pct >= 100).length;
        const activeIdx = enriched.findIndex(x => x.pct < 100);

        return `
          <div class="rec-carousel-head">
            <div>
              <h2 style="margin:0">Body & Mind Recovery (${esc(getTyMeta(t.ty)[0])})</h2>
              <small style="color:var(--mute);font-size:12px">
                Swipe left/right · <b>${unlockedCount}/${enriched.length}</b> clinical stages unlocked

            </div>
            <div style="display:flex;align-items:center;gap:6px">
              <button class="pill" style="font-size:10.5px;padding:4px 9px" onclick="useScaledTimeline=!useScaledTimeline;render()" title="Toggle Dose & Chronicity Scaling">
                ${useScaledTimeline ? `🧬 Scaled (${neuroScale}×)` : 'Standard'}
              </button>
              ${activeIdx > 0 ? `<button class="pill on" style="font-size:10.5px;padding:4px 9px" onclick="scrollToActiveRec(${activeIdx})">◎ Current</button>` : ''}
              <button class="rec-nav-btn" onclick="scrollRecCarousel(-1)" aria-label="Scroll left">‹</button>
              <button class="rec-nav-btn" onclick="scrollRecCarousel(1)" aria-label="Scroll right">›</button>

          <div class="rec-carousel" id="recCarousel">
            ${enriched.map((item) => {
              const isDone = realT && item.pct >= 100;
              const isCurrent = realT && item.idx === activeIdx;
              const nrtBadge = (t.mode === 'nrt' && item.tag === 'receptor')
                ? '🩹 NRT active (receptor taper pending)'
                : (t.mode === 'nrt' && item.tag === 'delivery')
                ? '✓ Smoke/Toxin Clearance'
                : '';
              const adjLabel = (useScaledTimeline && item.effectiveDays !== item.daysReq && item.daysReq >= 2)
                ? `${item.label} <small style="font-weight:400;opacity:.75">(adj. ~${item.effectiveDays < 30 ? Math.round(item.effectiveDays) + 'd' : item.effectiveDays < 365 ? (item.effectiveDays / 30).toFixed(1) + 'mo' : (item.effectiveDays / 365).toFixed(1) + 'yr'})</small>`
                : item.label;

              return `<div class="rec-card ${isDone ? 'done' : isCurrent ? 'current' : ''}" id="recCard_${item.idx}">
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px">
                    <span class="rec-sys-badge">${esc(item.sys)}</span>
                    <small style="font-size:11px;font-weight:700;color:${isDone ? 'var(--ok)' : isCurrent ? 'var(--a)' : 'var(--mute)'}">
                      ${isDone ? '✓ Unlocked' : isCurrent ? '⚡ In Progress' : `Stage ${item.idx + 1}/${enriched.length}`}
                    </small>
                  </div>
                  <div style="font-family:'Fraunces',Georgia,serif;font-size:23px;line-height:1.15;margin-bottom:6px">
                    ${adjLabel}
                  </div>
                  <p style="font-size:13px;line-height:1.5;color:var(--ink);margin:0">
                    ${esc(item.desc)}
                  </p>
                  ${nrtBadge ? `<small style="display:block;margin-top:6px;color:var(--a);font-size:11.5px;font-weight:600">${nrtBadge}</small>` : ''}
                </div>
                <div style="margin-top:6px">
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mute);margin-bottom:5px">
                    <span>${realT ? (isDone ? '100% Complete' : `${item.pct}% physiological progress`) : 'Clinical benchmark'}</span>
                    ${realT && !isDone ? `<strong style="color:var(--ink)">${item.remTxt}</strong>` : ''}
                  </div>
                  <div class="rec-bar" style="margin-top:0"><i style="width:${item.pct}%"></i></div>
                </div>
              </div>`;
            }).join('')}
          </div>

      })()}

      ${realT ? `

        <h2>History Manager & Clinical Report <button class="pill" style="font-size:11px;padding:3px 10px;text-transform:none" onclick="openClinicalReportModal()">📋 Clinical Summary</button></h2>
        <div class="gl" style="margin-bottom:14px">
          ${(C.length === 0 && slips.length === 0) ? `
            <div style="padding:14px 16px;font-size:13.5px;color:var(--mute)">No SOS sessions or slips recorded for ${esc(t.nm)} yet.</div>
          ` : `
            ${C.slice(-5).reverse().map(cItem => `
              <div class="row">
                <div>
                  <strong style="font-size:13.5px;color:var(--ok)">⚡ SOS Extinction Rep (${cItem.a}/10 → ${cItem.b}/10 VAS)</strong>
                  <div style="font-size:12px;color:var(--mute)">${new Date(cItem.ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}${(cItem.trs && cItem.trs.length) ? ' · ' + esc(cItem.trs.join(', ')) : (cItem.tr ? ' · ' + esc(cItem.tr) : '')}</div>
                </div>
                <button class="pill" style="font-size:11px;padding:3px 9px;color:#D9383A" onclick="deleteCravingLog(${cItem.ts})" title="Delete log">×</button>
              </div>
            `).join('')}
            ${slips.slice(-4).reverse().map((slItem) => `
              <div class="row">
                <div>
                  <strong style="font-size:13.5px;color:var(--warn)">${slItem.reset ? '🔄 Full Reset' : '▣ Momentary Slip'}</strong>
                  <div style="font-size:12px;color:var(--mute)">${new Date(slItem.ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}${slItem.note ? ' · ' + esc(slItem.note) : ''}</div>
                </div>
                <button class="pill" style="font-size:11px;padding:3px 9px;color:#D9383A" onclick="deleteSlipLog(${slItem.ts})" title="Remove slip record">×</button>
              </div>
            `).join('')}
          `}
        </div>

        <div style="display:flex;gap:10px;margin-top:18px">
          <button class="btn ghost" style="flex:1;margin-top:0" onclick="openEditTracker()">✎ Edit tracker</button>
          <button class="btn ghost" style="flex:1;margin-top:0;color:#D9383A" onclick="confirmDeleteTracker()">Remove tracker</button>
        </div>
      ` : `
        <button class="btn" style="margin-top:18px" onclick="openSuWithPreset('${previewTy}')">Start tracking ${esc(getTyMeta(previewTy)[0])}</button>
      `}
    </div>`;
  }

  /* ------------------------------------------
     TAB 4: UPGRADED CLINICAL JOURNAL (D3)
     ------------------------------------------ */
  if (v == 'jour') {
    const prompts = [
      ['ABC Functional Analysis', 'ABC Analysis — Antecedent Cue: \nOld Habit Function: \nNew Substitute Routine I used: '],
      ['Flatline / D₂ Check-in', 'Dopamine Flatline Check-in — Today my baseline energy/mood feels: \nOne natural protocol (Sunlight/BDNF/Cold) I completed: '],
      ['Permission Thought Caught', 'Permission-giving thought my brain offered today: “...”\nMy cognitive defusion counter: '],
      ['Gratitude & EFT Anchor', '30 days from now, my Future Self will thank me for today because: ']
    ];
    const tags = ['Win', 'Craving', 'Reflection', 'Slip'];

    m.innerHTML = `<div class="view-enter">
      <h1>Journal</h1>
      <p>Write what triggered a craving, what helped, or notes to your future self.</p>

      <!-- D3: 1-tap guided prompt chips -->
      <div class="pills" style="margin-bottom:8px">
        ${prompts.map(([lbl, prefix], idx) => `
          <button class="pill" style="font-size:12px" onclick="usePrompt(${idx})">✦ ${lbl}</button>
        `).join('')}
      </div>

      <textarea id="jt" placeholder="How are you feeling right now?" oninput="jDraft=this.value">${esc(jDraft)}</textarea>

      <!-- Mood / Category Tags + Tracker Association -->
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="jMoodPills">
          ${tags.map(tg => `
            <button class="pill ${jMood === tg ? 'on' : ''}" style="font-size:12px;padding:5px 12px" onclick="setJMood('${tg}')">${tg}</button>
          `).join('')}
        </div>
        ${t ? `<small style="color:var(--mute);font-size:12px">Linked to: <b>${esc(t.nm)}</b></small>` : ''}
      </div>

      <button class="btn" onclick="addJ()">${editJIdx !== null ? 'Update entry' : 'Save entry'}</button>
      ${editJIdx !== null ? `<button class="btn ghost" onclick="editJIdx=null;jDraft='';render()">Cancel edit</button>` : ''}

      <h2>Entries</h2>
      <!-- Search + Tag Filter + Tracker Filter -->
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <input type="search" placeholder="Search journal…" value="${esc(jQuery)}" oninput="jQuery=this.value;renderJournalList()" style="flex:1;min-width:160px;padding:9px 14px;font-size:14px">
        ${S.t.length > 1 ? `
          <select onchange="jTracker=this.value;renderJournalList()" style="width:auto;padding:9px 12px;font-size:13px">
            <option value="all" ${jTracker==='all'?'selected':''}>All habits</option>
            ${S.t.map(x => `<option value="${x.id}" ${jTracker===x.id?'selected':''}>${esc(x.nm)}</option>`).join('')}
          </select>
        ` : ''}
      </div>
      <div class="pills" style="margin-bottom:12px">
        ${['all', ...tags].map(flt => `
          <button class="pill ${jFilter === flt ? 'on' : ''}" style="font-size:12px;padding:5px 12px" onclick="jFilter='${flt}';renderJournalList()">

        `).join('')}

      <div id="jList"></div>
    </div>`;
    renderJournalList();
  }
}

function selectHmDay(k) {
  selectedHmDay = k;
  render();
}

function scrollRecCarousel(dir = 1) {
  const el = $('#recCarousel');
  if (!el) return;
  el.scrollBy({ left: dir * 295, behavior: 'smooth' });
}

function scrollToActiveRec(idx) {
  const card = document.getElementById('recCard_' + idx);
  const wrap = $('#recCarousel');
  if (card && wrap) {
    wrap.scrollTo({ left: Math.max(0, card.offsetLeft - 12), behavior: 'smooth' });
  }
}

function renderJournalList() {
  const box = $('#jList');
  if (!box) return;
  const items = S.j
    .map((entry, idx) => ({ entry, idx }))
    .filter(({ entry }) => {
      const entryTag = entry.tag || (/slip:/i.test(entry.x) ? 'Slip' : 'Reflection');
      if (jFilter !== 'all' && entryTag !== jFilter) return false;
      if (jTracker !== 'all' && entry.tid && entry.tid !== jTracker) return false;
      if (jQuery && !entry.x.toLowerCase().includes(jQuery.toLowerCase())) return false;
      return true;
    });

  box.innerHTML = items.length
    ? items.map(({ entry, idx }) => {
      const trk = S.t.find(x => x.id === entry.tid);
      const tagLbl = entry.tag || (/slip:/i.test(entry.x) ? 'Slip' : 'Reflection');
      return `
        <div class="note">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <small style="color:var(--mute)">${new Date(entry.d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</small>
              <span class="pill" style="font-size:11px;padding:2px 8px">${esc(tagLbl)}</span>
              ${trk ? `<small style="color:var(--mute);font-size:11px">· ${esc(trk.nm)}</small>` : ''}
            </div>
            <div style="display:flex;gap:6px">
              <button class="pill" style="font-size:11px;padding:2px 8px" onclick="startEditJ(${idx})" title="Edit entry">Edit</button>
              <button class="pill" style="font-size:11px;padding:2px 8px;color:#D9383A" onclick="deleteJ(${idx})" title="Delete entry">×</button>
            </div>
          </div>
          <div style="white-space:pre-wrap">${esc(entry.x)}</div>
        </div>
      `;
    }).join('')
    : '<p>No entries match your filter.</p>';
}

function usePrompt(idx) {
  const prefixes = [
    'ABC Analysis — Antecedent Cue: \nOld Habit Function: \nNew Substitute Routine I used: ',
    'Dopamine Flatline Check-in — Today my baseline energy/mood feels: \nOne natural protocol (Sunlight/BDNF/Cold) I completed: ',
    'Permission-giving thought my brain offered today: “...”\nMy cognitive defusion counter: ',
    '30 days from now, my Future Self will thank me for today because: '
  ];
  const jt = $('#jt');
  if (jt) {
    jt.value = (jt.value ? jt.value + '\n' : '') + prefixes[idx];
    jDraft = jt.value;
    jt.focus();
  }
}

function setJMood(tg) {
  const jt = $('#jt');
  if (jt) jDraft = jt.value;
  jMood = tg;
  render();
}

function addJ() {
  const jt = $('#jt');
  if (!jt) return;
  const x = jt.value.trim();
  if (!x) return;
  if (editJIdx !== null && S.j[editJIdx]) {
    S.j[editJIdx].x = x;
    S.j[editJIdx].tag = jMood;
    editJIdx = null;
    jDraft = '';
    showToast('Entry updated');
  } else {
    S.j.unshift({ d: Date.now(), x, tag: jMood || 'Reflection', tid: S.a || undefined });
    jDraft = '';
    showToast('Entry saved');
  }
  save();
  render();
}

/* ==========================================
   E2: TAP-TO-CYCLE 4 ORB READOUT MODES & LIVE TICKER
   ========================================== */
function cycleOrbMode() {
  S.orbMode = ((S.orbMode || 0) + 1) % 4;
  save();
  tick();
  const labels = [
    'Mode 1: Days + HH:MM:SS',
    'Mode 2: Total Hours Free',
    'Mode 3: Milestone Progress %',
    'Mode 4: Live Saved / Reclaimed'
  ];
  showToast(labels[S.orbMode]);
}

function tick() {
  if (document.hidden) return;
  const t = cur();
  if (!t || v != 'home' || !$('#dd')) return;
  const s = st(t);
  const elapsedMs = Math.max(0, Date.now() - t.s);
  const sec = Math.floor(elapsedMs / 1e3);
  const dy = Math.floor(sec / 86400);
  const totalHrs = (elapsedMs / 36e5).toFixed(1);

  $('#sn').textContent = SN[stg(s.d)];

  const hms = pad(Math.floor((sec % 86400) / 3600)) + ':' + pad(Math.floor((sec % 3600) / 60)) + ':' + pad(sec % 60);

  // Milestone calculation (B3: includes 6h & 12h)
  const i = MS.findIndex(x => x[0] > s.d);
  const nx = MS[i];
  const pv = i > 0 ? MS[i - 1][0] : 0;
  const pctNext = nx ? Math.min(1, Math.max(0, (s.d - pv) / (nx[0] - pv))) : 1;
  const remHours = nx ? Math.max(0, (nx[0] - s.d) * 24) : 0;
  const remLabel = remHours < 24 ? `${remHours.toFixed(1)}h left` : `${(nx[0] - s.d).toFixed(1)}d left`;

  // E2: 4 Orb Readout Modes
  if (S.orbMode === 1) {
    $('#dd').textContent = totalHrs;
    $('#dl').textContent = 'total hours free';
    $('#hm').textContent = `${dy}d · ${hms}`;
  } else if (S.orbMode === 2) {
    $('#dd').textContent = (pctNext * 100).toFixed(1) + '%';
    $('#dl').textContent = nx ? `to ${nx[1]}` : 'all milestones complete';
    $('#hm').textContent = nx ? remLabel : `${dy}d · ${hms}`;
  } else if (S.orbMode === 3) {
    $('#dd').textContent = t.c ? fm(s.m) : fh(s.h);
    $('#dl').textContent = t.c ? 'saved so far' : 'time reclaimed';
    $('#hm').textContent = `${dy}d · ${hms}`;
  } else {
    $('#dd').textContent = dy;
    $('#dl').textContent = dy == 1 ? 'day' : 'days';
    $('#hm').textContent = hms;
  }

  // A1: Continuous Day-0 avoided & time back
  $('#n').textContent = fn(s.exactN);
  $('#h').textContent = fh(s.h);
  $('#mo').textContent = t.c ? fm(s.m) : dy + 'd';

  // A2: Exact floating-point total days kept
  const exactTotalDays = (t.tot || 0) + s.d;
  $('#tt').textContent = ftot(exactTotalDays);
  const ttWrap = $('#ttWrap');
  if (ttWrap) ttWrap.title = `Exact total days kept: ${exactTotalDays.toFixed(2)} days`;

  $('#nl').textContent = nx
    ? `Next milestone: ${nx[1]} (${nx[2]}) · ${Math.round(pctNext * 100)}%`
    : 'Every milestone reached';

  const rg = $('#rg');
  if (rg) rg.style.strokeDashoffset = 766.5 * (1 - pctNext);

  // Rotate orbital milestone satellite smoothly around the circular ring (F2)
  const satGroup = $('#orbSatGroup');
  if (satGroup) {
    satGroup.style.transform = `rotate(${(pctNext * 360).toFixed(2)}deg)`;
  }

  const dayProgress = (sec % 86400) / 86400;
  const rgInner = $('#rgInner');
  if (rgInner) rgInner.style.strokeDashoffset = 666.0 * (1 - dayProgress);

  // Update 15-Minute Prefrontal Cooling Lockout Timer if active
  const lockTimer = $('#lockoutTimer');
  if (lockTimer) {
    const remSec = Math.max(0, Math.ceil(((S.lockoutUntil || 0) - Date.now()) / 1000));
    if (remSec > 0) {
      lockTimer.textContent = `${pad(Math.floor(remSec / 60))}:${pad(remSec % 60)}`;
    } else {
      S.lockoutUntil = 0;
      save();
      render();
    }
  }

  // Live-update Savings Goal bar if visible on Today screen
  const goalCost = +(t.goalCost || t.gc || 0);
  if (goalCost > 0) {
    const gPct = Math.min(100, Math.round((s.m / goalCost) * 100));
    const gTxt = $('#homeGoalSaved');
    const gBar = $('#homeGoalBar');
    if (gTxt) gTxt.textContent = `${fm(s.m)} / ${fm(goalCost)} (${gPct}%)`;
    if (gBar) gBar.style.width = `${gPct}%`;
  }
}

// F1: 60fps In-Place Neuro-Lab Scrubber Updater (Zero DOM Re-Mount Stutter)
function updateLabScrubber(val, syncInput = false) {
  labScrubDay = val;
  const realT = cur();
  const t = realT || getPreviewTracker(previewTy);
  const s = st(t);
  const neuroScale = getNeuroScale(t);

  if (syncInput) {
    const rng = $('#labRangeIn');
    if (rng) rng.value = val;
  }

  const d2Pct = Math.min(100, Math.round(100 * (1 - Math.exp(-val / (28 * neuroScale)))));
  const fosbClearedPct = Math.min(100, Math.round(100 * (1 - Math.exp(-val / (38 * neuroScale)))));
  const pfcControlPct = Math.min(100, Math.round(25 + 75 * (1 - Math.exp(-val / (21 * neuroScale)))));

  const projAvoided = Math.round(val * (t.p || 0));
  const projHours = (val * (t.p || 0) * (t.k || 0)) / 60;
  const projFullDays = (projHours / 24).toFixed(1);
  const rawMoney = val * (t.p || 0) * (t.c || 0);
  const markerX = 28 + (Math.min(90, val) / 90) * 290;

  const titleEl = $('#labDayTitle');
  if (titleEl) {
    const suffix = Math.abs(val - Math.round(s.d)) <= 1
      ? '<small style="font-size:12px;color:var(--ok)">(Current)</small>'
      : val > s.d
      ? `<small style="font-size:12px;color:var(--a)">(+${Math.round(val - s.d)}d in future)</small>`
      : '';
    titleEl.innerHTML = `Day ${val} ${suffix}`;
  }

  document.querySelectorAll('#labPresetBtns button').forEach(btn => {
    btn.classList.toggle('on', +btn.getAttribute('data-day') === val);
  });

  const lineEl = $('#labMarkerLine');
  if (lineEl) {
    lineEl.setAttribute('x1', markerX.toFixed(1));
    lineEl.setAttribute('x2', markerX.toFixed(1));
  }

  const pfcEl = $('#labPfcVal');
  if (pfcEl) pfcEl.textContent = pfcControlPct + '%';
  const d2El = $('#labD2Val');
  if (d2El) d2El.textContent = d2Pct + '%';
  const fosEl = $('#labFosVal');
  if (fosEl) fosEl.textContent = fosbClearedPct + '%';

  const avLbl = $('#labAvoidLbl');
  if (avLbl) avLbl.textContent = `Avoided by Day ${val}`;
  const avVal = $('#labAvoidVal');
  if (avVal) avVal.textContent = projAvoided.toLocaleString();
  const hrsVal = $('#labHrsVal');
  if (hrsVal) hrsVal.textContent = projHours < 48 ? projHours.toFixed(1) + ' h' : projFullDays + ' full days';
  const savLbl = $('#labSavLbl');
  if (savLbl) savLbl.textContent = `Direct Savings (Day ${val})`;
  const savVal = $('#labSavVal');
  if (savVal) savVal.textContent = t.c ? fm(rawMoney) : val + 'd clean';
}

/* ==========================================
   B5: DAILY PLEDGE RITUAL (Hold-to-Pledge + Tap Support)
   ========================================== */
let pledgeTimer = null, pledgeProgress = 0, pledgeDownTs = 0;
function startPledgeHold(e) {
  if (e && e.button && e.button !== 0) return;
  pledgeDownTs = Date.now();
  pledgeProgress = 0;
  const fill = $('#pledgeFill');
  const txt = $('#pledgeTxt');
  clearInterval(pledgeTimer);
  pledgeTimer = setInterval(() => {
    pledgeProgress += 9;
    if (fill) fill.style.width = Math.min(100, pledgeProgress) + '%';
    if (txt && pledgeProgress > 20) txt.textContent = `Keep holding… ${Math.min(100, pledgeProgress)}%`;
    if (pledgeProgress >= 100) {
      clearInterval(pledgeTimer);
      completeDailyPledge();
    }
  }, 35);
}

function endPledgeHold() {
  const heldMs = Date.now() - pledgeDownTs;
  clearInterval(pledgeTimer);
  if (heldMs > 0 && heldMs < 260 && pledgeProgress < 100) {
    // Quick tap fallback so mobile & mouse taps also feel responsive
    const fill = $('#pledgeFill');
    if (fill) fill.style.width = '100%';
    setTimeout(completeDailyPledge, 120);
  } else if (pledgeProgress < 100) {
    cancelPledgeHold();
  }
}

function cancelPledgeHold() {
  clearInterval(pledgeTimer);
  pledgeProgress = 0;
  const fill = $('#pledgeFill');
  const txt = $('#pledgeTxt');
  if (fill) fill.style.width = '0%';
  if (txt) txt.textContent = 'Hold to pledge for today';
}

function completeDailyPledge() {
  clearInterval(pledgeTimer);
  const k = todayKey();
  if (!S.pl) S.pl = {};
  if (S.pl[k] && S.pl[k].pledged) return;
  S.pl[k] = Object.assign(S.pl[k] || {}, { pledged: true, ts: Date.now() });
  save();
  playTone([440, 554.37, 659.25], 1.3, 'triangle', 0.08);
  vibrate([25, 40, 25]);
  triggerCelebrationBurst(0.5, 0.55);
  showToast('✨ Pledged to stay free today!');
  render();
}

async function copyTextToClipboard(text, successMsg = 'Copied to clipboard!') {
  if (!text) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
      return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  showToast(successMsg);
}

  const el = $('#shareTxt');
  if (el) copyTextToClipboard(el.value, 'Milestone summary copied to clipboard!');

function doRel() {
  const t = cur();
  if (!t) return;
  const cue = ($('#rtCue')?.value || '').trim();
  const func = ($('#rtFunc')?.value || '').trim();
  const x = ($('#rt')?.value || '').trim();
  if (cue) t.abcCue = cue;
  if (func) t.abcFunc = func;
  if (x) t.abcSub = x;

  const summaryParts = [];
  if (cue) summaryParts.push(`Cue: ${cue}`);
  if (func) summaryParts.push(`Sought: ${func}`);
  if (x) summaryParts.push(`Next Plan: ${x}`);
  const fullNote = summaryParts.join(' | ');

  const exactDays = Math.max(0, (Date.now() - t.s) / 864e5);
  if (!Array.isArray(t.slips)) t.slips = [];

  if (slipMode === 'lapse') {
    t.slips.push({ ts: Date.now(), note: fullNote });
    S.j.unshift({
      d: Date.now(),
      x: `${t.nm} momentary slip${fullNote ? ' — ' + fullNote : ' (logged with streak context intact)'}`,
      tag: 'Slip',
      tid: t.id
    });
    save();
    ov();
    showToast('Momentary slip & ABC analysis logged.');
    render();
  } else {
    // A2: Preserve exact floating-point days in t.tot
    t.rec = Math.max(t.rec || 0, exactDays);
    t.tot = (t.tot || 0) + exactDays;
    t.att = (t.att || 1) + 1;
    t.slips.push({ ts: Date.now(), note: fullNote, reset: true });
    t.s = Date.now();
    S.j.unshift({
      d: Date.now(),
      x: `${t.nm} slip & timer reset (${exactDays.toFixed(2)}d banked)${fullNote ? ' — ' + fullNote : ''}`,
      tag: 'Slip',
      tid: t.id
    });
    save();
    ov();
    showToast(`${exactDays.toFixed(2)} clean days banked. Timer restarted.`);
    render();
  }
}

// O3: Visuospatial Working-Memory 4x4 Grid Sequence Logic
let wmTimeouts = [];
function clearWmTimeouts() {
  wmTimeouts.forEach(id => clearTimeout(id));
  wmTimeouts = [];
}

function startWmRound() {
  if (!sx || sx.s !== 1 || sx.mode !== 'memory' || sx.memSubMode !== 'grid') return;
  clearWmTimeouts();
  const len = (sx.wmLevel || 1) + 2;
  const seq = [];
  while (seq.length < len) {
    const r = Math.floor(Math.random() * 16);
    if (seq[seq.length - 1] !== r) seq.push(r);
  }
  sx.wmSeq = seq;
  sx.wmUser = [];
  sx.wmState = 'watching';

  const stEl = $('#wmStatus');
  if (stEl) stEl.textContent = 'Watch pattern…';
  document.querySelectorAll('#wmGrid .wm-tile').forEach(el => el.classList.remove('lit', 'ok', 'err'));

  seq.forEach((tileIdx, stepIdx) => {
    wmTimeouts.push(setTimeout(() => {
      const btn = document.querySelector(`#wmGrid .wm-tile[data-idx="${tileIdx}"]`);
      if (btn) {
        btn.classList.add('lit');
        playTone([380 + tileIdx * 22], 0.22, 'sine', 0.04);
        setTimeout(() => btn.classList.remove('lit'), 360);
      }
    }, 350 + stepIdx * 540));
  });

  wmTimeouts.push(setTimeout(() => {
    sx.wmState = 'playing';
    const stEl2 = $('#wmStatus');
    if (stEl2) stEl2.textContent = `Your turn (0/${seq.length})`;
  }, 400 + seq.length * 540));
}

function tapWmTile(idx) {
  if (!sx || sx.wmState !== 'playing') return;
  const btn = document.querySelector(`#wmGrid .wm-tile[data-idx="${idx}"]`);
  const expected = sx.wmSeq[sx.wmUser.length];

  if (idx === expected) {
    sx.wmUser.push(idx);
    vibrate(15);
    playTone([440 + idx * 24], 0.2, 'sine', 0.045);
    if (btn) {
      btn.classList.add('ok');
      setTimeout(() => btn.classList.remove('ok'), 260);
    }
    const stEl = $('#wmStatus');
    if (stEl) stEl.textContent = `Good (${sx.wmUser.length}/${sx.wmSeq.length})`;

    if (sx.wmUser.length === sx.wmSeq.length) {
      sx.wmState = 'idle';
      sx.wmScore = (sx.wmScore || 0) + sx.wmSeq.length * 10;
      sx.wmLevel = Math.min(6, (sx.wmLevel || 1) + 1);

      if (stEl) stEl.textContent = '✓ Pattern cleared! Next…';
      wmTimeouts.push(setTimeout(startWmRound, 900));
    }
  } else {
    sx.wmState = 'idle';
    vibrate([30, 50, 30]);
    if (btn) {
      btn.classList.add('err');
      setTimeout(() => btn.classList.remove('err'), 450);

    const stEl = $('#wmStatus');
    if (stEl) stEl.textContent = 'Resetting pattern…';
    wmTimeouts.push(setTimeout(startWmRound, 900));
  }
}

// Bilateral EMDR Ocular Pacer with Stereo L/R Audio Entrainment
function initEmdrPacer() {
  cancelAnimationFrame(emdrAnim);
  const dot = $('#emdrDot');
  const track = $('#emdrTrack');
  if (!dot || !track) return;
  let lastSide = 0;

  function step(tm) {
    if (!document.body.contains(dot) || !sx || sx.s !== 1 || sx.mode !== 'emdr') return;
    const freq = sx.emdrSpeed || 1.1;
    const phase = Math.sin((tm / 1000) * freq * Math.PI * 2); // -1 to +1
    const maxOffset = (track.clientWidth - 56) / 2;
    dot.style.transform = `translateX(calc(-50% + ${(phase * maxOffset).toFixed(1)}px))`;

    if (phase > 0.92 && lastSide !== 1) {
      lastSide = 1;
      playPanPulse(0.85, 432);
      vibrate(12);
    } else if (phase < -0.92 && lastSide !== -1) {
      lastSide = -1;
      playPanPulse(-0.85, 396);
      vibrate(12);
    }
    emdrAnim = requestAnimationFrame(step);
  }
  emdrAnim = requestAnimationFrame(step);
}

function renderPosterCanvas() {
  const cv = $('#posterCv');
  const t = cur();
  if (!cv || !t) return;
  const ctx = cv.getContext('2d');
  const s = st(t);
  const stage = stg(s.d);
  const cr30 = getCleanRate30(t);

  // Editorial Dawn Gradient Background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, 1000);
  if (stage < 2) {
    bgGrad.addColorStop(0, '#141736');
    bgGrad.addColorStop(0.55, '#2A1F4A');
    bgGrad.addColorStop(1, '#0D0F1F');
  } else {
    bgGrad.addColorStop(0, '#FFB05C');
    bgGrad.addColorStop(0.45, '#F0663F');
    bgGrad.addColorStop(1, '#1D1830');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 1000);
  // Stats Box (safe cross-browser rounded rect)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.11)';
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(80, 600, 640, 220, 28);
  } else {
    ctx.rect(80, 600, 640, 220);
  }
  ctx.fill();

  // Ring
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';

// A3: High-precision JS-driven breathing animation via CSS custom properties --b-scale and --b-op
let lastBreathPhase = '';
function surf() {
  sx.s = 1;
  sx.t0 = Date.now();
  lastBreathPhase = '';
  drawSos();
  const P = ['Notice it.', 'Where do you feel it?', 'Breathe into it.', 'Watch it peak.', 'Let it fall.'];

  const f = () => {
    if (!sx || sx.s !== 1) return;
    const el = (Date.now() - sx.t0) / 1e3;
    const r = Math.max(0, sx.len - Math.floor(el));
    const cdEl = $('#cd');
    if (cdEl) cdEl.textContent = Math.floor(r / 60) + ':' + pad(r % 60);

    const prEl = $('#pr');
    if (prEl) prEl.textContent = P[Math.floor(el / 22) % 5];

    const blEl = $('#bl');
    if (blEl) {
      const bm = BREATH_MODES[sx.bPattern || 'calm'] || BREATH_MODES.calm;
      const totalCycle = bm.phases.reduce((acc, p) => acc + p[1], 0);
      let e = el % totalCycle;
      let curPhase = bm.phases[0][0];
      let scale = 0.65;
      let remInPhase = 0;

      for (let i = 0; i < bm.phases.length; i++) {
        const [label, dur, startScale, endScale] = bm.phases[i];
        if (e <= dur || i === bm.phases.length - 1) {
          curPhase = label;
          remInPhase = Math.max(0, dur - e);
          const prog = Math.min(1, Math.max(0, e / dur));
          // Smooth cosine interpolation for organic lung expansion
          const smooth = 0.5 - 0.5 * Math.cos(prog * Math.PI);
          scale = startScale + (endScale - startScale) * smooth;
          break;
        }
        e -= dur;
      }

      const op = 0.25 + (scale - 0.55) * 0.65;
      document.documentElement.style.setProperty('--b-scale', scale.toFixed(3));
      document.documentElement.style.setProperty('--b-op', op.toFixed(3));
      const cleanPhaseName = curPhase.replace(/\s*\(.*\)/, '');
      blEl.innerHTML = `<span>${cleanPhaseName}</span><small style="font-size:12px;opacity:0.85;margin-top:3px;font-variant-numeric:tabular-nums">${remInPhase.toFixed(1)}s</small>`;

      if (curPhase !== lastBreathPhase) {
        lastBreathPhase = curPhase;
        speakCoach(curPhase.replace(/\(.*\)/, ''));
        if (curPhase.includes('in') || curPhase.includes('Top-up')) {
          playTone(curPhase.includes('Top-up') ? [528, 792] : [396, 594], 0.75, 'sine', 0.035);
          vibrate(18);
        } else if (curPhase.includes('out') || curPhase.includes('exhale')) {
          playTone([330, 495], 1.1, 'sine', 0.035);
          vibrate([15, 30, 15]);
        }
      }
    }
  };
  f();
  clearInterval(tk);
  tk = setInterval(f, 50);
}

// C3: Interactive Tactile Focus Canvas (Water Ripples + Floating Light Motes)
function initWaveGame() {
  cancelAnimationFrame(waveAnim);
  const cv = $('#waveCv');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;

  const ripples = [];
  const motes = Array.from({ length: 8 }, () => ({
    x: Math.random() * cv.width,
    y: cv.height * (0.2 + Math.random() * 0.8),
    r: (14 + Math.random() * 14) * dpr,
    vy: (0.5 + Math.random() * 0.8) * dpr,
    ph: Math.random() * Math.PI * 2
  }));

  const spawnRipple = (ev) => {
    const rect = cv.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * dpr;
    const py = (ev.clientY - rect.top) * dpr;
    ripples.push({ x: px, y: py, r: 4 * dpr, maxR: 95 * dpr, alpha: 0.75 });

    motes.forEach(b => {
      if (Math.hypot(px - b.x, py - b.y) <= b.r * 1.55) {
        sx.pops++;
        const pc = $('#popCount');
        if (pc) pc.textContent = sx.pops;
        playTone([528 + (sx.pops % 5) * 40], 0.25, 'sine', 0.045);
        vibrate(15);
        ripples.push({ x: b.x, y: b.y, r: b.r, maxR: 110 * dpr, alpha: 0.9 });
        b.y = cv.height + b.r;
        b.x = b.r + Math.random() * (cv.width - b.r * 2);
      }
    });
  };

  let isDragging = false;
  cv.onpointerdown = (ev) => { isDragging = true; spawnRipple(ev); };
  cv.onpointermove = (ev) => {
    if (!isDragging) return;
    if (Math.random() < 0.35) spawnRipple(ev);
  };
  cv.onpointerup = cv.onpointerleave = cv.onpointercancel = () => { isDragging = false; };

  function step(tm) {
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, cv.width, cv.height);

    // Draw soothing multi-layered ocean urge wave
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath();
      ctx.moveTo(0, cv.height);
      for (let x = 0; x <= cv.width; x += 10) {
        const y = cv.height * (0.56 + layer * 0.12) +
          Math.sin(x * 0.014 + tm * (0.0022 - layer * 0.0006)) * (16 - layer * 4) * dpr +
          Math.cos(x * 0.008 - tm * 0.0014) * 9 * dpr;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(cv.width, cv.height);
      ctx.closePath();
      ctx.fillStyle = layer === 0 ? 'rgba(255, 176, 92, 0.26)' : 'rgba(240, 102, 63, 0.18)';
      ctx.fill();
    }

    // Draw expanding water ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += 1.8 * dpr;
      rp.alpha *= 0.965;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 176, 92, ${rp.alpha})`;
      ctx.lineWidth = 2 * dpr;
      ctx.stroke();
      if (rp.alpha < 0.04 || rp.r > rp.maxR) ripples.splice(i, 1);
    }

    // Draw floating light motes / urge bubbles
    motes.forEach(b => {
      b.y -= b.vy;
      b.x += Math.sin(tm * 0.003 + b.ph) * 0.45 * dpr;
      if (b.y < -b.r) {
        b.y = cv.height + b.r;
        b.x = b.r + Math.random() * (cv.width - b.r * 2);
      }
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240, 102, 63, 0.28)';
      ctx.strokeStyle = 'rgba(255, 176, 92, 0.85)';
      ctx.lineWidth = 2 * dpr;
      ctx.fill();
      ctx.stroke();
    });

    waveAnim = requestAnimationFrame(step);
  }
  waveAnim = requestAnimationFrame(step);
}

function downloadBackupFile() {
  try {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `reclaim-backup-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded reclaim-backup.json');
  } catch (e) {
    exportData();
  }
}

function importBackupFile(inputEl) {
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(String(ev.target.result || ''));
      if (parsed && Array.isArray(parsed.t)) {
        S = Object.assign(S, parsed);
        save();
        ov();
        showToast('Backup file restored!');
        render();
      } else {
        showToast('Invalid Reclaim backup file');
      }
    } catch (err) {
      showToast('Could not read JSON file');
    }
  };
  reader.readAsText(file);
}

  const raw = ($('#impTxt')?.value || '').trim();

    { d: now - 9 * 864e5, x: 'Morning coffee tastes noticeably richer this week. Completed Morning Sunlight and Zone-2 BDNF run.', tag: 'Reflection', tid: id1 }
  ];

}

/* ==========================================
   PROGRESSIVE WEB APP (PWA) ENGINE: DYNAMIC ICONS, MANIFEST, SERVICE WORKER & INSTALL FLOW
   ========================================== */
let deferredInstallPrompt = null;
let generatedAppIcon192 = '';
let generatedAppIcon512 = '';

function generatePwaIconDataUrl(size = 512) {
  try {
    const cv = document.createElement('canvas');
    cv.width = size;
    cv.height = size;
    const ctx = cv.getContext('2d');

    // Deep night-to-dawn background squircle/square
    const bg = ctx.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, '#161329');
    bg.addColorStop(0.55, '#2A1D3D');
    bg.addColorStop(1, '#090B16');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    // Warm dawn horizon glow
    const glow = ctx.createRadialGradient(size * 0.5, size * 0.5, size * 0.05, size * 0.5, size * 0.5, size * 0.44);
    glow.addColorStop(0, 'rgba(255, 168, 76, 0.52)');
    glow.addColorStop(0.55, 'rgba(234, 94, 54, 0.25)');
    glow.addColorStop(1, 'rgba(234, 94, 54, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(size * 0.5, size * 0.5, size * 0.44, 0, Math.PI * 2);
    ctx.fill();

    // Outer track ring
    ctx.strokeStyle = 'rgba(246, 239, 232, 0.16)';
    ctx.lineWidth = size * 0.045;
    ctx.beginPath();
    ctx.arc(size * 0.5, size * 0.5, size * 0.33, 0, Math.PI * 2);
    ctx.stroke();

    // Active sunrise progress arc
    const arcGrad = ctx.createLinearGradient(0, 0, size, size);
    arcGrad.addColorStop(0, '#FFA84C');
    arcGrad.addColorStop(1, '#EA5E36');
    ctx.strokeStyle = arcGrad;
    ctx.lineWidth = size * 0.05;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(size * 0.5, size * 0.5, size * 0.33, -Math.PI * 0.5, Math.PI * 1.15);
    ctx.stroke();

    // Center editorial "R" emblem
    ctx.fillStyle = '#F6EFE8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `400 ${Math.round(size * 0.34)}px Georgia, serif`;
    ctx.fillText('R', size * 0.5, size * 0.52);

    return cv.toDataURL('image/png');
  } catch (e) {
    return '';
  }
}

function initPWA() {
  // Use pre-rendered static PNG icon by default; only rasterize on canvas if running via file://
  if (location.protocol === 'file:') {
    generatedAppIcon192 = generatePwaIconDataUrl(192);
    generatedAppIcon512 = generatePwaIconDataUrl(512);
    try {
      const startUrl = window.location.href.split('#')[0];
      const manifestObj = {
        id: startUrl,
        name: 'Reclaim — Mindful Habit Freedom & Urge Surfing',
        short_name: 'Reclaim',
        description: 'Clinical-grade habit recovery, dynamic dawn sky orb, and urge-surfing SOS suite.',
        start_url: startUrl,
        scope: '.',
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#090B16',
        theme_color: '#F6EFE8',
        categories: ['health', 'lifestyle', 'medical'],
        icons: [
          { src: generatedAppIcon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: generatedAppIcon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
      const manifestLink = $('#manifestLink') || document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      if (!manifestLink.parentNode) document.head.appendChild(manifestLink);
    } catch (e) {}
  } else {
    generatedAppIcon192 = './icon-192.png';
    generatedAppIcon512 = './icon-512.png';
  }

  // Capture Chrome/Edge/Android native install prompt
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    applyTheme();
  });

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    applyTheme();
    playTone([528, 660, 880], 1.1, 'triangle', 0.07);
    triggerCelebrationBurst(0.5, 0.45);
    showToast('🎉 Reclaim installed as a standalone app!');
  });

  // Register ./sw.js for offline PWA support
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

async function triggerNativeInstall() {
  if (!deferredInstallPrompt) {
    showToast('Use your browser menu to Add to Home Screen or Install');
    return;
  }
  try {
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') {
      deferredInstallPrompt = null;
      ov();
    }
  } catch (e) {}
}

  ov(`
    <button class="x" onclick="ov()">×</button>
    <div style="display:flex;align-items:center;gap:14px;margin:10px 0 12px">
      ${generatedAppIcon192 ? `<img src="${generatedAppIcon192}" alt="Reclaim App Icon" style="width:64px;height:64px;border-radius:16px;box-shadow:var(--shd);border:1px solid var(--ln-strong)">` : ''}
      <div>
        <span class="pill" style="font-size:11px;padding:3px 9px;margin-bottom:4px">📲 Progressive Web App</span>
        <h1 style="font-size:26px;margin:0">Install Reclaim</h1>
      </div>
    </div>
    <p>Launch Reclaim full-screen from your Home Screen or Dock with zero browser bars and 100% offline privacy.</p>

    ${isStandalone ? `
      <div class="note" style="border-color:var(--ok)">
        <strong style="color:var(--ok)">✓ Reclaim is currently running as an installed app!</strong>
        <div style="margin-top:4px;font-size:13px">Your data stays saved locally on your device. Remember to export occasional JSON backups in Settings.</div>
      </div>
    ` : ''}

    ${deferredInstallPrompt ? `
      <button class="btn" onclick="triggerNativeInstall()">📲 Install Reclaim App Now</button>
    ` : ''}

    <div class="gl" style="padding:16px 18px;margin-top:12px">
      <strong style="font-size:14.5px;display:block;margin-bottom:8px">How to install on your device:</strong>

      <div class="rec-item" style="padding:10px 0">
        <strong style="font-size:13.5px;color:var(--a)">🍎 iPhone & iPad (Safari) ${isIOS ? '· Detected' : ''}</strong>
        <div style="font-size:13px;color:var(--mute);margin-top:3px">
          1. Tap the <b>Share</b> button <span style="display:inline-block;padding:1px 6px;border-radius:6px;border:1px solid var(--ln)">↑</span> in Safari’s bottom/top bar.<br>
          2. Scroll down and tap <b>“Add to Home Screen”</b>.
        </div>
      </div>

      <div class="rec-item" style="padding:10px 0">
        <strong style="font-size:13.5px;color:var(--a)">🤖 Android (Chrome / Edge / Brave)</strong>
        <div style="font-size:13px;color:var(--mute);margin-top:3px">
          1. Tap the browser menu <b>⋮</b> (top right).<br>
          2. Tap <b>“Install app”</b> or <b>“Add to Home screen”</b>.
        </div>
      </div>

      <div class="rec-item" style="padding:10px 0;border:0">
        <strong style="font-size:13.5px;color:var(--a)">💻 Desktop (Chrome / Edge / macOS Safari)</strong>
        <div style="font-size:13px;color:var(--mute);margin-top:3px">
          Click the <b>Install icon</b> in the right side of the address bar (or <b>File → Add to Dock</b> in macOS Safari).
        </div>
      </div>
    </div>

    <button class="btn ghost" onclick="ov()">Done</button>
  `);
}

function handleHashShortcut() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  if (h === 'sos') {
    setTimeout(() => sos(), 60);
  } else if (['home', 'lab', 'prog', 'jour'].includes(h)) {
    v = h;
    render();
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tick();
});
window.addEventListener('hashchange', handleHashShortcut);

window.onload = function () {
  initPWA();
  initSkyCanvas();
  render();
  handleHashShortcut();
};
</script>
